<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

<body>
    <h1>Criar novo post</h1>

    <!--Formulario de criação de post-->
    <form action="criar_post.php" method="post">

        <label for="titulo">Título: </label><br>
        <input type="text" id="titulo" name="titulo" required><br><br>

        <label for="conteudo">conteúdo: </label><br>
        <textarea  id="conteudo" name="conteudo" cols="35" rows="20" required></textarea><br><br>

        <label for="data-hora">data e hora</label><br>
        <input type="date">
       <input type="time">
        <br><br>
       <button type="submit" value="Enviar">Criar Post</button>
    </form>

<script>
    let funcionario = { CodFun: '1' };
        let isLoading = false;

        function getFuncionarios(){
                isLoading = true;

            fetch('http://localhost/api/backend/remover_funcionario_por_id.php',
                    {
                        //criacao e ultilização do metódo delet
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(funcionario)
                    }
                )
                //resposta em json
            .then(response => response.json())
            .then(response => {
                console.log(response);
            })
            .catch(erro => {
                console.log(erro);
            })
            .finally(()=>{
                isLoading = false;
            })
        }

        getFuncionarios(); // Buscar Dados
    </script>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    

</body>
</html>
