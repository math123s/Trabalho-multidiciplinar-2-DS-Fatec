<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro de Treinadores</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside>
    <div class="brand">Fundação Informatica</div>
    <nav>
      <a href="pagina.html">Início</a>
      <a href="index.html">Saiba Mais</a>
      <a href="index.html">Trabalhe Conosco</a>
    </nav>
  </aside>

  <main>
    <h1>Cadastro de Treinadores</h1>
    <form id="formTreinador">
      <div>
        <label for="nome" class="label">Nome</label>
        <input type="text" id="nome" class="input" required />
      </div>
      <div>
        <label for="idade" class="label">Idade</label>
        <input type="number" id="idade" class="input" required />
      </div>
      <div>
        <label for="cidade" class="label">Cidade</label>
        <input type="text" id="cidade" class="input" required />
      </div>
      <div>
        <label for="pokemons" class="label">Pokémons</label>
        <input type="text" id="pokemons" class="input" placeholder="Ex: pikachu, bulbasaur" />
      </div>
      <button type="submit" class="btn btn-primary mt-1">Cadastrar</button>
    </form>

    <h2 class="mt-3">Treinadores Cadastrados</h2>
    <ul id="listaTreinadores"></ul>
  </main>

  <script src="Treinador.js"></script>
  <script src="main.js"></script>
</body>
</html>
